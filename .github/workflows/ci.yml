name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test
      - run: pnpm build
      - name: "Refresh package lists (the runner image can ship stale ones)"
        run: sudo apt-get update
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm audit --prod --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,vector,mailpit
      - run: pnpm exec supabase db reset
      - name: "Seed twice (the seed must be idempotent)"
        run: |
          pnpm db:seed
          pnpm db:seed
      - run: pnpm test:db

  auth-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,vector
      - name: "Export Supabase env for build and tests"
        run: node scripts/supabase-env.mjs >> "$GITHUB_ENV"
      - name: "Seed users and catalog (no images, no demo operations)"
        run: pnpm db:seed --skip-images --skip-demo
      - run: pnpm build
      - name: "Refresh package lists (the runner image can ship stale ones)"
        run: sudo apt-get update
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:auth
      - name: "Lighthouse (mobile) on the home page: median of 5 runs"
        run: |
          pnpm exec next start -p 3100 &
          npx --yes wait-on@8 http://localhost:3100/fr
          for i in 1 2 3 4 5; do
            npx --yes lighthouse@12.8.2 http://localhost:3100/fr --only-categories=performance --form-factor=mobile \
              --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lighthouse-home-$i.json --quiet
          done
          node scripts/check-lighthouse.mjs 0.85 lighthouse-home-*.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: auth-e2e-report
          path: |
            playwright-report-auth
            test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-home
          path: lighthouse-home-*.json
          if-no-files-found: ignore
